[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with a small local LLM using constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # not imported by src/: the provided llm_sdk needs it on CUDA machines
    # (it passes device_map="auto" to transformers when a GPU is found)
    "accelerate>=1.0.0",
    "llm-sdk",
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk/llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"